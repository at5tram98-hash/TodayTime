<script>
  window.TodayTimeOneSignal = null;
  window.TodayTimeOneSignalReady = false;
  window.TodayTimeOneSignalError = null;
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(function(OneSignal) {
    // Expose the SDK immediately so the UI does not remain stuck on 「準備中」
    // while OneSignal finishes initialization in the background.
    window.TodayTimeOneSignal = OneSignal;
    Promise.resolve(OneSignal.init({
      appId: "048a698f-32ac-4a9a-bbaa-398b61959754",
      serviceWorkerPath: "TodayTime/OneSignalSDKWorker.js",
      serviceWorkerParam: { scope: "/TodayTime/" },
      notifyButton: { enable: false }
    })).then(function(){
      window.TodayTimeOneSignalReady = true;
      window.TodayTimeOneSignalError = null;
      window.dispatchEvent(new Event('tt-onesignal-state-change'));
    }).catch(function(err){
      console.error('OneSignal init failed', err);
      window.TodayTimeOneSignalError = String(err && (err.message || err) || 'init_failed');
      window.dispatchEvent(new Event('tt-onesignal-state-change'));
    });
  });
</script>

<script>
/* TodayTime brand intro preflight: decide theme + splash before body paints. */
(function(){
  const FLAG='tt_splash_seen';
  const params=new URLSearchParams(location.search);
  const force=params.get('splash')==='1'||params.get('splash')==='preview';
  let appearance='light';
  try{
    const raw=localStorage.getItem('todaytime:v2:main')||localStorage.getItem('todaytime:v2:staging');
    if(raw){const saved=JSON.parse(raw);appearance=saved?.preferences?.appearance==='dark'?'dark':'light'}
  }catch{}
  document.documentElement.dataset.theme=appearance;
  const show=force||localStorage.getItem(FLAG)!=='1';
  window.__TT_SPLASH_BOOT={show,force,start:performance.now(),flag:FLAG};window.__TODAYTIME_FINAL_BUILD="2026-09-02-final";
  if(show)document.documentElement.classList.add('tt-splash-pending');
  window.__TT_SPLASH_FAILSAFE=setTimeout(()=>{
    if(!document.documentElement.classList.contains('tt-splash-pending'))return;
    document.documentElement.classList.add('tt-splash-revealing');
    const el=document.getElementById('splash');
    if(el){el.classList.add('is-exiting');el.setAttribute('aria-hidden','true')}
    setTimeout(()=>{
      document.documentElement.classList.remove('tt-splash-pending','tt-splash-revealing');
      if(el){el.hidden=true;el.classList.remove('is-entered','is-exiting')}
    },420);
  },2500);
})();
</script>

/* ===== iOS Settings-grade hierarchy polish ===== */
:root{
  --ios-page-x:16px;
  --ios-section-gap:26px;
  --ios-group-radius:14px;
  --ios-row-h:60px;
  --ios-separator:rgba(60,60,67,.20);
}
html[data-theme="dark"]{--ios-separator:rgba(84,84,88,.62)}
.full-page-head{padding:calc(var(--safe-top) + 6px) var(--ios-page-x) 7px;background:color-mix(in srgb,var(--bg) 96%,transparent);border-bottom:0}
.full-nav{height:44px;grid-template-columns:54px minmax(0,1fr) 68px;gap:8px}

.full-back{width:44px!important;height:44px!important;border-radius:50%;display:grid!important;place-items:center!important;color:var(--text)!important;background:var(--surface)!important;box-shadow:0 .5px 0 var(--line);justify-self:start}
.full-back .icon{width:25px;height:25px;stroke-width:2.3}
.full-action{justify-self:end;min-width:44px!important;min-height:44px!important;padding:0 4px!important;font-size:15px!important;color:var(--blue)!important;font-weight:600!important}
.full-heading{padding:14px 4px 9px}
.full-heading h1{font-size:34px;font-weight:760;letter-spacing:-1.25px;line-height:1.02}
.full-heading p{font-size:13px;line-height:1.35;margin-top:7px;color:var(--muted)}
.full-scroll{height:calc(100dvh - var(--safe-top) - 112px);padding:12px var(--ios-page-x) calc(var(--safe-bottom) + 34px)}

.feature-intro-card{grid-template-columns:58px minmax(0,1fr);gap:16px;padding:20px 18px;margin:2px 0 24px;border-radius:22px;background:var(--surface);border:.5px solid var(--line);box-shadow:none}
.feature-intro-icon{width:58px;height:58px;border-radius:15px;background:var(--surface3)}
.feature-intro-icon .icon{width:30px;height:30px;stroke-width:1.85}
.feature-intro-copy{align-self:center;min-width:0}
.feature-intro-copy strong{font-size:20px;font-weight:720;letter-spacing:-.45px;line-height:1.15}
.feature-intro-copy span{font-size:13px;line-height:1.45;color:var(--muted);margin-top:7px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.mode-section-title,.settings-section-title,.full-section-title{font-size:12.5px;font-weight:600;letter-spacing:.01em;color:var(--muted);margin:26px 14px 8px}
.mode-group,.group,.full-group{border-radius:var(--ios-group-radius);background:var(--surface);border:0;box-shadow:none;overflow:hidden}
.mode-row,.settings-row{min-height:var(--ios-row-h);grid-template-columns:34px minmax(0,1fr) auto 16px;gap:11px;padding:8px 12px;border-bottom:.5px solid var(--ios-separator);background:var(--surface)}
.mode-row:last-child,.settings-row:last-child{border-bottom:0}
.mode-row:active,.settings-row:active{background:var(--surface3)}
.mode-row-icon,.settings-icon{width:30px;height:30px;border-radius:8px}
.mode-row-icon .icon,.settings-icon .icon{width:18px;height:18px}
.mode-row-title,.settings-name{font-size:16px;font-weight:500;letter-spacing:-.15px;line-height:1.2}
.mode-row-sub,.settings-sub{font-size:11.5px;line-height:1.3;margin-top:3px;color:var(--muted)}
.mode-row-value,.settings-value{font-size:13px;color:var(--muted);font-weight:450}
.mode-row.static{cursor:default}.mode-row.static:active{background:var(--surface)}
.mode-primary-cta{width:100%;min-height:52px;margin:24px 0 4px;border-radius:13px;background:var(--blue);color:#fff;font-size:16px;font-weight:700;letter-spacing:-.15px}
.mode-primary-cta:active{opacity:.82;transform:scale(.992)}

/* Tomorrow plan: quiet system hierarchy */
.nextday-flow-page,.nextday-screen{padding-bottom:18px}
.nextday-stepper-card{margin:0 0 24px;padding:16px 14px 13px;border-radius:16px;background:var(--surface);border:.5px solid var(--line)}
.nextday-progress-head{display:flex;justify-content:space-between;align-items:center;margin:0 2px 12px;font-size:12px;color:var(--muted)}
.nextday-progress-head strong{font-size:12px;color:var(--secondary);font-variant-numeric:tabular-nums}
.nextday-stepper{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:0 2px}
.nextday-stepper::before{content:"";position:absolute;left:16.66%;right:16.66%;top:15px;height:2px;background:var(--surface3);border-radius:99px}
.nextday-stepper::after{content:"";position:absolute;left:16.66%;top:15px;height:2px;width:var(--step-progress,0%);max-width:66.68%;background:var(--green);border-radius:99px;transition:width .28s ease}
.nextday-step{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:7px;min-height:58px;color:var(--muted);background:transparent}
.nextday-step .step-icon{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface3);border:2px solid var(--surface);color:var(--muted)}
.nextday-step .step-icon .icon{width:16px;height:16px}
.nextday-step>span:last-child{display:flex;flex-direction:column;align-items:center;gap:1px}
.nextday-step strong{font-size:11.5px;font-weight:650;color:inherit}
.nextday-step>span:last-child>span{font-size:9px;min-height:11px;color:var(--muted)}
.nextday-step.active{color:var(--blue)}
.nextday-step.active .step-icon{background:var(--blue);color:#fff}
.nextday-step.done{color:var(--green)}
.nextday-step.done .step-icon{background:var(--green);color:#fff}
.nextday-step:disabled{opacity:1}

.nextday-home-state-card{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:13px;align-items:center;padding:16px 14px;background:var(--surface);border-radius:14px}
.nextday-home-state-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(10,132,255,.12);color:var(--blue)}
.nextday-home-state-icon.review{background:rgba(88,86,214,.12);color:var(--indigo)}
.nextday-home-state-icon.approved{background:rgba(52,199,89,.13);color:var(--green)}
.nextday-home-state-icon .icon{width:23px;height:23px}
.nextday-home-state-copy strong{display:block;font-size:17px;letter-spacing:-.25px}
.nextday-home-state-copy span{display:block;font-size:12px;color:var(--muted);margin-top:4px;line-height:1.3}
.nextday-state-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;background:var(--surface3);font-size:11px;font-weight:650;color:var(--secondary);white-space:nowrap}
.nextday-state-badge.planning{color:var(--orange);background:rgba(255,149,0,.12)}
.nextday-state-badge.review{color:var(--blue);background:rgba(0,122,255,.11)}
.nextday-state-badge.approved{color:var(--green);background:rgba(52,199,89,.12)}
.nextday-state-badge .icon{width:13px;height:13px}
.nextday-deadline-inline{display:flex;align-items:center;gap:8px;padding:11px 12px;font-size:12px;color:var(--secondary)}
.nextday-deadline-inline .icon{width:17px;height:17px;color:var(--orange)}
.nextday-quiet-summary{margin-top:0}
.nextday-review-warning,.nextday-conflict-card{border-radius:14px;box-shadow:none;border:.5px solid rgba(255,149,0,.28);background:rgba(255,149,0,.08)}
.nextday-review-warning.danger,.nextday-conflict-card.danger{border-color:rgba(255,59,48,.3);background:rgba(255,59,48,.08)}
.nextday-review-summary,.nextday-flow-section-card,.jobs-panel{border-radius:14px;background:var(--surface);border:0;box-shadow:none}
.nextday-approved-center{text-align:center;padding:18px 14px 8px}
.nextday-approved-center .nextday-approved-mark{margin:0 auto 14px;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:rgba(52,199,89,.13);color:var(--green)}
.nextday-approved-center .nextday-approved-mark .icon{width:36px;height:36px;stroke-width:2.2}
.nextday-approved-center h2{font-size:24px;letter-spacing:-.6px;margin:0}
.nextday-approved-center p{font-size:13px;color:var(--muted);line-height:1.45;margin:8px auto 0;max-width:300px}
.nextday-cta-dock-rich{position:sticky;bottom:calc(var(--safe-bottom) + 4px);padding:12px 0 4px;background:linear-gradient(180deg,transparent,var(--bg) 28%)}
.nextday-cta{min-height:52px;border-radius:13px;font-size:16px;font-weight:700}

/* Jobs: Settings-like hierarchy */
.jobs-page{padding-bottom:18px}
.jobs-home-summary{margin:0 0 4px}
.jobs-summary-icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:rgba(255,149,0,.13);color:var(--orange)}
.jobs-summary-icon .icon{width:18px;height:18px}
.jobs-detail-hero,.jobs-hero{background:var(--surface);border-radius:14px;box-shadow:none;border:0;padding:16px}
.job-salary-card{background:var(--surface);border-radius:0;border-bottom:.5px solid var(--ios-separator);padding:13px 12px}
.job-salary-card:last-child{border-bottom:0}
.job-salary-list{border-radius:14px;overflow:hidden;background:var(--surface)}
.jobs-filter-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 18px}
.jobs-filter-bar select{min-height:44px;border:0;border-radius:10px;background:var(--surface);padding:0 10px;font-size:14px}
.jobs-page .jobs-panel{padding:0;overflow:hidden}
.jobs-page .jobs-panel-head{padding:12px 12px 8px}
.jobs-page .jobs-panel-head h3{font-size:16px}
.jobs-page .jobs-panel-head span{font-size:11px;color:var(--muted)}

/* Empty / feedback consistency */
.empty,.empty-action{border-radius:14px;box-shadow:none;background:var(--surface)}
.toast{border-radius:12px;box-shadow:none}
.undo-bar{border-radius:12px;box-shadow:none}
@media(max-width:390px){
  .full-heading h1{font-size:32px}
  .feature-intro-card{grid-template-columns:52px minmax(0,1fr);padding:17px 15px;gap:13px}
  .feature-intro-icon{width:52px;height:52px;border-radius:14px}
  .feature-intro-icon .icon{width:27px;height:27px}
  .mode-row,.settings-row{grid-template-columns:32px minmax(0,1fr) auto 14px;padding-left:11px;padding-right:10px}
  .mode-row-icon,.settings-icon{width:29px;height:29px}
  .nextday-home-state-card{grid-template-columns:42px minmax(0,1fr) auto;gap:10px;padding:14px 12px}
}



/* ===== Professional release polish ===== */
/* HIG寄りに影・境界線・角丸を統一し、カードの“浮きすぎ”を抑制 */
:root{--shadow:none;--pro-radius-sm:12px;--pro-radius-md:16px;--pro-radius-lg:20px;--pro-page-gap:20px}
.card,.group,.mode-group,.feature-intro-card,.jobs-panel,.nextday-review-summary,.nextday-flow-section-card,.live-focus,.live-context-card,.live-mini{box-shadow:none!important}
.card,.live-focus,.live-context-card,.live-mini{border:.5px solid color-mix(in srgb,var(--line) 78%,transparent)}
.content,.live-page{padding-left:18px;padding-right:18px}.section-title{margin-top:28px;margin-bottom:10px}.feature-intro-card{margin-bottom:28px}.mode-section-title,.settings-section-title,.full-section-title{margin-top:30px;margin-bottom:9px}.mode-group,.group,.full-group{border-radius:15px}.mode-row,.settings-row{min-height:62px;padding-top:9px;padding-bottom:9px}.mode-primary-cta,.primary-wide{box-shadow:none!important}.round-btn{box-shadow:none;border:.5px solid color-mix(in srgb,var(--line) 82%,transparent)}
/* 翌日計画の承認インジケーターを“カード3個”ではなく連続した進行UIに変更 */
.nextday-stepper-card{padding:17px 16px 15px;border:0;background:var(--surface);border-radius:18px;box-shadow:none}.nextday-progress-head{margin:0 1px 16px;font-size:11.5px}.nextday-stepper{padding:0 7px;isolation:isolate}.nextday-stepper::before{left:17%;right:17%;top:15px;height:3px;background:var(--surface3)}.nextday-stepper::after{left:17%;top:15px;height:3px;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .42s cubic-bezier(.2,.8,.2,1)}.nextday-step{min-height:64px;gap:8px;transition:color .2s ease,transform .2s ease}.nextday-step .step-icon{width:31px;height:31px;border:3px solid var(--surface);box-shadow:0 0 0 1px color-mix(in srgb,var(--line) 65%,transparent);transition:background .25s ease,color .25s ease,transform .25s cubic-bezier(.2,.9,.2,1),box-shadow .25s ease}.nextday-step.active .step-icon{box-shadow:0 0 0 4px rgba(0,122,255,.12);transform:scale(1.06)}.nextday-step.done .step-icon{box-shadow:0 0 0 4px rgba(52,199,89,.10)}.nextday-step.done .step-icon .icon{animation:ttCheckIn .28s cubic-bezier(.2,.9,.2,1)}.nextday-step strong{font-size:12px;font-weight:680;letter-spacing:-.1px}.nextday-step>span:last-child>span{font-size:9.5px}@keyframes ttCheckIn{from{opacity:0;transform:scale(.5) rotate(-12deg)}to{opacity:1;transform:none}}
/* 翌日計画の派手なダッシュボード感を抑え、余白と階層でプロ感を出す */
.nextday-home-status,.nextday-stage-hero,.jobs-detail-hero{box-shadow:none!important}.nextday-stage-hero{border-radius:20px;padding:20px 18px}.nextday-stage-hero:after{display:none}.nextday-stage-hero.planning{background:color-mix(in srgb,var(--blue) 7%,var(--surface))}.nextday-stage-hero.review{background:color-mix(in srgb,var(--indigo) 6%,var(--surface))}.nextday-stage-hero.approved{background:color-mix(in srgb,var(--green) 7%,var(--surface))}.nextday-workspace-block{margin:22px 0;padding:17px;border-radius:16px;box-shadow:none!important}.nextday-free-card.rich{border-radius:15px}.nextday-cta-dock{padding-top:16px}
/* カレンダーは矢印ナビを廃止し、タイトル + アクション + 横スワイプ中心へ */
.calendar-toolbar{gap:10px}.calendar-toolbar-top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px}.calendar-nav{display:flex!important;align-items:center;min-width:0}.calendar-nav-title{width:auto!important;max-width:100%!important;min-width:0!important;height:44px!important;min-height:44px!important;padding:0 4px!important;font-size:24px!important;font-weight:760!important;letter-spacing:-.65px;text-align:left!important;justify-content:flex-start!important;color:var(--text)!important}.calendar-tool-icons{display:grid;grid-template-columns:repeat(3,38px);gap:7px}.calendar-tool-icons .round-btn{width:38px;height:38px;min-width:38px;min-height:38px;border:0;background:var(--surface)}.calendar-tool-icons .round-btn::before{inset:-3px}.calendar-view-segmented{margin-top:1px!important}#calendarBody{touch-action:pan-y pinch-zoom;will-change:transform,opacity}#calendarBody.calendar-swipe-preview{transform:translateX(var(--calendar-drag-x,0));transition:none}#calendarBody.calendar-swipe-release-left{animation:calendarSlideLeft .14s ease-out}#calendarBody.calendar-swipe-release-right{animation:calendarSlideRight .14s ease-out}@keyframes calendarSlideLeft{to{transform:translateX(-32px);opacity:.45}}@keyframes calendarSlideRight{to{transform:translateX(32px);opacity:.45}}.calendar-scroll{overscroll-behavior-y:contain}
/* バイト専用画面を落ち着いたプロ用ワークスペースへ */
.jobs-page{padding-bottom:28px}.jobs-home-summary .mode-row{min-height:66px}.jobs-panel{padding:16px;border-radius:16px}.job-shift-row{min-height:66px}.job-shift-main small{line-height:1.45}.job-break-pill{display:inline-flex;align-items:center;padding:3px 7px;border-radius:999px;background:rgba(255,149,0,.11);color:var(--orange);font-size:9.5px;font-weight:700;margin-left:5px}.job-shift-preview{margin:14px 0 0;padding:14px;border-radius:14px;background:var(--surface);border:.5px solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.job-shift-preview div{text-align:center}.job-shift-preview span{display:block;font-size:9.5px;color:var(--muted)}.job-shift-preview strong{display:block;font-size:14px;margin-top:4px}
/* ダークモードで線とサーフェスのコントラストを過度に上げない */
html[data-theme="dark"] .card,html[data-theme="dark"] .live-focus,html[data-theme="dark"] .live-context-card,html[data-theme="dark"] .live-mini{border-color:rgba(84,84,88,.48)}html[data-theme="dark"] .nextday-stepper-card,html[data-theme="dark"] .jobs-panel{background:#1c1c1e}



/* レイヤー順を固定して full-page / sheet / context / toast の競合を防止 */
.full-page{z-index:130}.scrim{z-index:150}.sheet{z-index:160}.cal-drag-ghost{z-index:250}.drag-validation{z-index:252}.action-sheet{z-index:280}.finish-menu{z-index:285}.undo-bar{z-index:295}.toast{z-index:300}.context-popover-scrim{z-index:339}.context-popover{z-index:340}.focus-mode{z-index:360}
/* セグメント選択の影をiOS相当のごく弱い奥行きに統一 */

/* 最終UI監査 — 左だけ色面に見える課題カードを廃止し、左右対称のグループ行へ統一 */
.assignment-rich-list{display:block;background:var(--surface);border-radius:16px;overflow:hidden;border:.5px solid color-mix(in srgb,var(--line) 72%,transparent)}
.assignment-rich-row{border-radius:0!important;box-shadow:none!important;border:0;border-bottom:.5px solid var(--ios-separator);padding:14px 14px 13px;background:var(--surface)}

.assignment-rich-row:active{background:var(--surface3)}
.assignment-rich-row .bar,.school-assignment-mini .bar{height:6px;border-radius:999px;background:color-mix(in srgb,var(--surface3) 88%,transparent);overflow:hidden}
.assignment-rich-row .bar i,.school-assignment-mini .bar i{min-width:0;border-radius:999px;background:linear-gradient(90deg,var(--blue),color-mix(in srgb,var(--blue) 66%,var(--indigo)))}

/* 翌日計画インジケータ。ラベルを上、線と丸を下に分離し、線が四角い要素へ重ならない構造 */
.nextday-stepper-card{padding:15px 14px 14px;border-radius:16px;background:var(--surface);border:.5px solid color-mix(in srgb,var(--line) 70%,transparent);box-shadow:none}
.nextday-progress-head{margin:0 2px 15px}

.nextday-step-label{text-align:center;min-width:0;color:var(--muted)}

.nextday-step-track{position:absolute;left:16.666%;right:16.666%;top:14px;height:2px;border-radius:999px;background:var(--surface3);overflow:hidden;z-index:0}
.nextday-step-track i{display:block;width:var(--step-progress,0%);height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .28s cubic-bezier(.22,.8,.22,1)}
.nextday-stepper{display:contents!important;margin:0!important;padding:0!important}
.nextday-stepper::before,.nextday-stepper::after{display:none!important}
.nextday-step{position:relative;z-index:1;justify-self:center;width:30px!important;height:30px!important;min-height:30px!important;padding:0!important;border:0!important;border-radius:50%!important;background:transparent!important;display:grid!important;place-items:center!important;opacity:1!important}
.nextday-step .step-icon{width:28px!important;height:28px!important;border-radius:50%!important;display:grid!important;place-items:center!important;background:var(--surface)!important;border:2px solid var(--surface3)!important;color:var(--muted)!important;box-shadow:0 0 0 3px var(--surface)}
.nextday-step.active .step-icon{background:var(--blue)!important;border-color:var(--blue)!important;color:#fff!important}
.nextday-step.done .step-icon{background:var(--green)!important;border-color:var(--green)!important;color:#fff!important}
.nextday-step .step-icon .icon{width:15px!important;height:15px!important}

/* バイトは全画面で同じ仕事アイコンを使い、通常予定と視覚的に区別 */
.job-occ-icon{display:inline-grid;place-items:center;flex:0 0 auto;width:20px;height:20px;border-radius:6px;background:color-mix(in srgb,currentColor 13%,transparent);vertical-align:middle}
.job-occ-icon .icon{width:13px;height:13px;stroke-width:2}
.cal-title-line{display:flex;align-items:center;gap:5px;min-width:0}
.cal-title-line .cal-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-event.job{outline:.5px solid color-mix(in srgb,currentColor 22%,transparent)}
.cal-event.job .job-occ-icon{width:16px;height:16px;border-radius:5px;background:color-mix(in srgb,currentColor 14%,transparent)}
.cal-event.job .job-occ-icon .icon{width:11px;height:11px}
.today-name-line,.flow-title-line,.live-context-title-line,.nextday-event-title-line{display:flex;align-items:center;gap:6px;min-width:0}
.today-name-line>span:last-child,.flow-title-line>span:last-child,.live-context-title-line>span:last-child,.nextday-event-title-line>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-job-chip{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:650;background:color-mix(in srgb,var(--job-color,var(--orange)) 12%,var(--surface2));color:var(--job-color,var(--orange))}
.live-job-chip .icon{width:14px;height:14px}
.calendar-tool-icons{grid-template-columns:repeat(4,36px)!important;gap:5px!important}
.calendar-tool-icons .round-btn{width:36px!important;height:36px!important;min-width:36px!important;min-height:36px!important}
.calendar-jobs-btn{color:var(--orange)!important}


/* シフト編集に交通費を追加。小さい画面でも4指標が崩れない */
.money-field{display:flex;align-items:center;justify-content:flex-end;gap:6px;min-width:0}.money-field input{max-width:132px;text-align:right}.money-field span{font-size:13px;color:var(--muted)}
.job-shift-preview{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:7px!important}

/* シフト一覧も左の色棒だけに依存せず、仕事アイコンで意味を伝える */
.job-shift-row{grid-template-columns:30px 58px minmax(0,1fr) 16px!important;border-left:0!important}
.job-shift-row>i{display:none!important}.job-shift-icon,.job-salary-icon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,currentColor 12%,transparent)}
.job-shift-icon .icon,.job-salary-icon .icon{width:16px;height:16px}
.job-salary-name i{display:none}


/* カレンダー月タイトルは矢印なしの単一タイトルとしてレイアウトし、4つのアクションとの競合を防ぐ */
.calendar-nav{display:flex!important;align-items:center!important;min-width:0!important;overflow:hidden!important;grid-template-columns:none!important}
.calendar-nav-title{width:auto!important;min-width:0!important;max-width:min(180px,100%)!important;height:38px!important;padding:0 4px!important;text-align:left!important;justify-content:flex-start!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}

/* ジョブアイコンを足しても既存タイトルのタイポ階層が崩れないよう補正 */
.today-name-line{font-size:14px;font-weight:650;letter-spacing:-.18px}
.flow-title-line{font-size:14px;font-weight:650;letter-spacing:-.16px}
.live-context-title-line{font-size:15px;font-weight:650;letter-spacing:-.2px}
.nextday-event-title-line{font-size:14px;font-weight:700;letter-spacing:-.16px}
/* 週表示はドット列を少し広げ、勤務アイコンがタイトルに食い込まないようにする */
.week-item{grid-template-columns:48px 22px minmax(0,1fr)!important}
.week-item .dot.job-week-icon{width:20px!important;height:20px!important;border-radius:6px!important;display:grid!important;place-items:center!important;background:color-mix(in srgb,var(--job-color,#ff9f0a) 14%,var(--surface3))!important;color:var(--job-color,#ff9f0a)!important}
.week-item .dot.job-week-icon .icon{width:13px!important;height:13px!important}


/* 翌日計画の進行表示を「上にラベル／下に線と丸」だけの静かな構成へ。四角いステップ部品は使わない */
.nextday-step-labels{margin:0 0 10px!important}
.nextday-step-label strong{font-size:13px!important;font-weight:650!important;letter-spacing:-.15px!important}
.nextday-step-label.active strong{font-weight:760!important}
.nextday-step-label span{display:none!important}
.nextday-step-indicator{height:32px!important}
.nextday-step-track{top:15px!important;height:2px!important}
.nextday-step{width:32px!important;height:32px!important;min-width:32px!important;min-height:32px!important}
.nextday-step .step-icon{width:26px!important;height:26px!important;border-width:2px!important;box-shadow:0 0 0 4px var(--surface)!important}
.nextday-step:not(.active):not(.done) .step-icon{background:var(--surface)!important;border-color:color-mix(in srgb,var(--muted) 42%,var(--surface3))!important}
.nextday-step.active .step-icon{box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 10%,var(--surface))!important}
.nextday-step.done .step-icon{box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 8%,var(--surface))!important}


/* Final consolidation: swipe rails stay completely hidden until a real horizontal gesture opens them. */
.swipe-wrap,.bi-swipe{width:100%;min-width:0;position:relative;overflow:hidden}
.swipe-wrap>.swipe-main,.bi-swipe-main{width:100%;min-width:0;box-sizing:border-box}
.swipe-rail,.bi-swipe-left,.bi-swipe-right{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s ease}
.swipe-wrap.swipe-active .swipe-rail,.swipe-wrap.swipe-open .swipe-rail,
.bi-swipe.swipe-active .bi-swipe-left,.bi-swipe.swipe-active .bi-swipe-right,
.bi-swipe.swipe-open .bi-swipe-left,.bi-swipe.swipe-open .bi-swipe-right{opacity:1;visibility:visible;pointer-events:auto}

/* Final consolidation: normal calendar events use the whole column; a sub-schedule lane is reserved only when it exists. */
.cal-event{width:calc(100% - 8px)!important;right:4px;box-sizing:border-box}
.cal-event.has-subs{width:57%!important;right:auto}
.cal-event.school,.cal-event.rest,.cal-event.autoRest{width:calc(100% - 8px)!important}
.cal-event.travel.has-subs{width:57%!important}
.cal-job-break{position:absolute;left:4px;right:4px;z-index:4;min-height:9px;border-radius:5px;background:repeating-linear-gradient(135deg,color-mix(in srgb,currentColor 19%,var(--surface)) 0 5px,color-mix(in srgb,currentColor 7%,var(--surface)) 5px 10px);border:.5px solid color-mix(in srgb,currentColor 28%,transparent);display:flex;align-items:center;padding:0 4px;font-size:7.5px;font-weight:750;line-height:1;color:currentColor;overflow:hidden;white-space:nowrap;pointer-events:none}

/* Final consolidation: salary month navigation is isolated from the generic calendar title styles. */
.job-salary-month-nav{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:10px;margin:2px 0 22px;background:var(--surface);border-radius:16px;min-height:64px;padding:8px 10px;border:.5px solid color-mix(in srgb,var(--line) 74%,transparent)}
.job-salary-month-nav>button{width:44px;height:44px;display:grid;place-items:center;color:var(--blue);border-radius:12px}
.job-salary-month-nav>button:active{background:var(--surface3)}
.job-salary-month-label{min-width:0;text-align:center;display:flex;align-items:baseline;justify-content:center;gap:6px;white-space:nowrap}
.job-salary-month-label strong{font-size:21px;font-weight:760;letter-spacing:-.45px}
.job-salary-month-label span{font-size:12px;color:var(--secondary);font-weight:600}
@media(max-width:390px){.job-salary-month-nav{grid-template-columns:40px minmax(0,1fr) 40px;gap:6px}.job-salary-month-nav>button{width:40px;height:40px}.job-salary-month-label strong{font-size:19px}.job-salary-month-label span{font-size:11px}}

/* Final consolidation: shift editor terminology and break-time controls. */
.job-break-time-field[hidden]{display:none!important}
.job-shift-preview>div{min-width:0}
.job-shift-preview strong{white-space:nowrap}


/* 統合: 給与サマリーは狭いiPhone幅でも月見出し・金額・内訳が重ならない */
.job-salary-list{min-width:0;overflow:hidden;border-radius:14px;background:var(--surface)}
.job-salary-card{min-width:0;overflow:hidden;box-sizing:border-box}
.job-salary-head{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}
.job-salary-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job-salary-amount{white-space:nowrap;max-width:44vw;overflow:hidden;text-overflow:ellipsis;text-align:right}
.job-salary-meta{display:grid!important;grid-template-columns:1fr;gap:3px;min-width:0;line-height:1.35}
.job-salary-meta span{min-width:0;white-space:normal;overflow-wrap:anywhere}
.job-salary-month-label{min-width:0;text-align:center}
.job-salary-month-label strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:20px;letter-spacing:-.35px}
.job-salary-month-label span{display:block;margin-top:2px;color:var(--secondary);font-size:11px}
@media(max-width:390px){.job-salary-card{padding:12px 11px}.job-salary-amount{font-size:14px;max-width:42vw}.job-salary-name{font-size:13.5px}}

/* Release polish: empty values must not reserve awkward whitespace */
.mode-row-value:empty,.menu-value:empty,.settings-value:empty,.full-row-value:empty{display:none}
.mode-row.static{grid-template-columns:40px minmax(0,1fr) auto}
.mode-row.static>span:last-child:empty{display:none}
@media(max-width:390px){.mode-row.static{grid-template-columns:36px minmax(0,1fr) auto}}

/* Live: upcoming state is visually distinct from a true empty period */
.live-soon{border:.5px solid color-mix(in srgb,var(--orange) 28%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--orange) 7%,var(--surface)),var(--surface))}
.live-soon-count{margin-top:14px;font-size:34px;line-height:1;font-weight:760;letter-spacing:-1.2px;font-variant-numeric:tabular-nums}
.live-soon-meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--secondary)}
.live-soon-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}
.live-soon-actions button{min-height:44px;border-radius:12px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;line-height:1}.live-soon-actions button .icon{width:17px;height:17px}
.live-soon-actions .primary{background:var(--blue);color:#fff}.live-soon-actions .secondary{background:var(--surface2);color:var(--blue)}

/* For Pro: dense calculations are moved to dedicated drill-down pages */
.pro-summary-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 18px}
.pro-summary-strip>div{min-width:0;background:var(--surface);border:.5px solid var(--line);border-radius:14px;padding:11px}
.pro-summary-strip span,.pro-summary-strip strong{display:block}.pro-summary-strip span{font-size:9.5px;color:var(--muted)}.pro-summary-strip strong{margin-top:4px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.live-clock-pill{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-height:28px;padding:0 9px;border-radius:999px;background:var(--surface3);color:var(--muted);font-size:12px;font-weight:650;letter-spacing:0;font-variant-numeric:tabular-nums}
.live-clock-large{font-size:30px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.live-focus,.live-soon{position:relative;min-width:0;overflow:hidden;padding:16px;border-radius:20px}
.live-event-title-line,.today-name-line,.flow-title-line,.live-context-title-line{display:flex;align-items:center;gap:6px;min-width:0}
.live-event-title{min-width:0;font-size:24px;line-height:1.14;font-weight:720;letter-spacing:-.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-event-meta{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-focus-main{display:grid;grid-template-columns:minmax(96px,106px) minmax(0,1fr);gap:14px;align-items:center;margin-top:14px;min-width:0}
.live-progress-button{min-width:0;width:100%}
.progress-ring{width:100%;max-width:106px;height:auto;aspect-ratio:1;margin-inline:auto}
.live-primary-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;min-width:0;width:100%}
.live-primary-metric{min-width:0;padding:10px 9px}
.live-primary-metric span,.live-primary-metric strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-primary-metric strong{font-size:18px;line-height:1.12}
.live-count{padding:14px}
.live-count-value{font-size:34px;line-height:1.05;letter-spacing:-1px;margin-top:4px}
.forecast-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;min-width:0}
.forecast-cell{min-width:0;padding:10px;border-radius:12px}
.forecast-cell span,.forecast-cell strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.forecast-cell strong{font-size:16px;line-height:1.15}
.forecast-cell small{white-space:normal;overflow-wrap:anywhere}
.live-actions,.live-soon-actions{min-width:0}
.live-actions .action-btn,.live-soon-actions button{min-width:0;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:7px;line-height:1.15}
.live-job-chip,.job-occ-icon{flex:0 0 auto}
.live-attention{position:relative;overflow:hidden}
.live-attention:before{left:0;top:16px;bottom:16px}
.live-mini-scroll{overflow-x:auto;overflow-y:hidden;padding:0 12px 5px;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.live-mini-track{min-width:1100px;padding-inline:2px}
.tt-alert-stack{margin:10px 16px 0;gap:8px}
.tt-alert{min-width:0}
.tt-alert-copy span{overflow-wrap:anywhere}
.migration-banner,.clipboard-banner{min-width:0}

/* Today + menu rows */
.today-row{grid-template-columns:54px minmax(0,1fr) auto;gap:8px;min-width:0;overflow:hidden}
.today-copy,.today-name-line,.today-name{min-width:0}
.today-name{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.today-meta{min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-height:1.25}
.today-row>.pill{max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#todayScreen .section-title{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}
.today-tools{display:flex;align-items:center;justify-content:flex-end;gap:6px;min-width:0}
.today-tools .small-pill{min-width:0;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.visual-dashboard{grid-template-columns:126px minmax(0,1fr);min-width:0}
.visual-card{min-width:0}
.menu-row,.settings-row,.mode-row{min-width:0;min-height:60px;align-items:center}
.menu-row{grid-template-columns:34px minmax(0,1fr) auto 16px}
.settings-row{grid-template-columns:34px minmax(0,1fr) auto 16px}
.mode-row{grid-template-columns:40px minmax(0,1fr) auto 16px}
.menu-sub,.mode-row-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-value,.settings-value,.mode-row-value{max-width:min(30vw,112px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.settings-icon,.menu-icon,.mode-row-icon{background:var(--surface3);color:var(--secondary);box-shadow:none}
.settings-icon.green,.settings-icon.orange,.settings-icon.purple,.menu-icon.green,.menu-icon.orange,.menu-icon.purple,.mode-row-icon.green,.mode-row-icon.orange,.mode-row-icon.purple,.mode-row-icon.gray{background:var(--surface3);color:var(--secondary)}
.settings-icon.red,.mode-row-icon.red{background:color-mix(in srgb,var(--red) 11%,var(--surface));color:var(--red)}
html[data-theme="dark"] .settings-icon,html[data-theme="dark"] .menu-icon,html[data-theme="dark"] .mode-row-icon{background:#2c2c2e;color:#c7c7cc}

/* Calendar: header and body share one horizontal scroller and one column definition. */
#calendarScreen.active{display:flex;flex-direction:column;overflow:hidden}
#calendarScreen .calendar-topbar{position:relative;top:auto;flex:0 0 auto}
#calendarBody{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.calendar-scroll{height:auto;flex:1 1 auto;min-height:0;overflow:auto;position:relative;background:var(--bg);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.calendar-grid,.day-heads{display:grid;grid-template-columns:var(--tt-calendar-axis) repeat(2,minmax(var(--tt-calendar-day-min),1fr));min-width:calc(var(--tt-calendar-axis) + (var(--tt-calendar-day-min) * 2));width:max(100%,calc(var(--tt-calendar-axis) + (var(--tt-calendar-day-min) * 2)))}
.day-heads{position:sticky;top:0;z-index:24;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:.5px solid var(--line)}
.calendar-toolbar{gap:8px;min-width:0}
.calendar-toolbar-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;min-width:0}
.calendar-nav{display:flex;min-width:0;align-items:center}
.calendar-nav-title{width:auto;max-width:100%;min-width:0;min-height:44px;padding:0 4px;font-size:22px;font-weight:760;letter-spacing:-.55px;text-align:left;justify-content:flex-start;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calendar-tool-icons{display:grid;grid-template-columns:repeat(4,44px);gap:0;min-width:0}
.calendar-tool-icons .round-btn{position:relative;width:44px;height:44px;min-width:44px;min-height:44px}
.calendar-tool-icons .round-btn:before{display:none}
.calendar-view-segmented{min-width:0}
.cal-event{box-sizing:border-box;min-height:18px;overflow:hidden;padding:3px 4px;border-radius:7px}
.cal-title,.cal-event .event-title{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;line-height:1.15}
.cal-meta{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:8px;line-height:1.15}
.cal-event.job .job-occ-icon{vertical-align:middle}
.cal-drag-ghost{width:min(150px,calc(100vw - 24px));max-width:calc(100vw - 24px)}
.drag-validation{max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}

/* Timetable: horizontal scroll remains intentional; period column stays visible. */
.timetable-scroll{position:relative;overflow-x:auto;overflow-y:hidden;padding:0 16px 8px;overscroll-behavior-x:contain;box-shadow:inset -14px 0 12px -14px rgba(0,0,0,.28)}
.timetable{overflow:visible}
.timetable>.tt-head:first-child,.timetable>.tt-period{position:sticky;left:0;z-index:4;background:var(--surface);box-shadow:1px 0 0 var(--line)}
.timetable>.tt-head:first-child{z-index:6}

/* Full page + next-day planner */
.full-page{display:flex;flex-direction:column}
.full-page-head{min-width:0;position:relative;flex:0 0 auto}
.full-nav{height:44px;display:grid;grid-template-columns:var(--tt-full-side) minmax(0,1fr) var(--tt-full-side);gap:6px;align-items:center}
.full-nav strong{min-width:0;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px;font-weight:650}
.full-back,.full-action{min-width:44px;min-height:44px}
.full-back{justify-self:start}
.full-action{justify-self:end;max-width:var(--tt-full-side);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.full-heading h1{font-size:32px;line-height:1.08;letter-spacing:-.9px}
.full-heading p{overflow-wrap:anywhere}
.full-scroll{position:relative;inset:auto;flex:1 1 auto;min-height:0;height:auto;overflow:auto;padding-bottom:calc(var(--safe-bottom) + 28px)}
.full-page-head.compact-head+.full-scroll{padding-top:8px}
.nextday-flow-page{padding-bottom:24px}
.nextday-cta-dock{position:sticky;bottom:0;margin:22px -4px 0;padding:10px 4px max(10px,var(--safe-bottom));background:linear-gradient(to bottom,transparent,var(--bg) 24%)}
.nextday-stage-hero,.nextday-stepper-card,.nextday-kpis,.nextday-review-grid{min-width:0}
.nextday-kpi strong,.nextday-review-card strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nextday-step-labels{grid-template-columns:repeat(3,minmax(0,1fr))}
.nextday-step-label{min-width:0;text-align:center}
.nextday-step-label strong{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nextday-step-indicator{grid-template-columns:repeat(3,minmax(0,1fr))}
.nextday-step{min-width:44px;min-height:44px;justify-self:center}

/* Sheets / forms / popovers */
.sheet,.sheet-inner{max-height:92dvh}
.sheet-scroll{min-height:0;overflow:auto;padding-bottom:calc(var(--safe-bottom) + 82px)}
.sheet-scroll>.primary-wide:last-child{position:sticky;bottom:calc(var(--safe-bottom) + 8px);z-index:3;box-shadow:0 -10px 22px color-mix(in srgb,var(--bg) 88%,transparent)}
.sheet-scroll>.danger-wide:last-child{position:static;bottom:auto;z-index:auto;box-shadow:none}

/* Destructive actions belong to the document flow, never to a floating dock. */
.danger-wide,.job-native-danger{position:static!important;inset:auto!important;display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;height:50px;margin:18px 0 4px;padding:0 14px;border:.5px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:none!important;color:var(--red);font-size:14px;font-weight:600;line-height:1.2;text-align:center;transform:none!important;transition:background .12s ease,color .12s ease}
.danger-wide:active,.job-native-danger:active{background:color-mix(in srgb,var(--surface) 92%,var(--red) 8%)}
.sheet-scroll>.danger-wide:last-child{margin-bottom:2px}
@media(prefers-reduced-motion:reduce){.danger-wide,.job-native-danger{transition:none}}
.field{min-width:0}
.field label,.field input,.field select,.field textarea{min-width:0}
.context-popover{max-width:calc(100vw - 16px)}
.action-sheet{max-width:calc(100vw - 20px);margin-inline:auto}
/* z-index contract: full-page 130 < sheet 160 < drag 250 < action 280 < toast 300 < context 340 < focus 360 < splash 10000 */

/* Swipe rows: rounded clipping belongs to wrapper; visible surface belongs to main only. */
.swipe-wrap,.bi-swipe{background:transparent;overflow:hidden;isolation:isolate}
.swipe-wrap>.swipe-main,.bi-swipe-main{position:relative;z-index:2;background:var(--surface)}
.swipe-rail,.bi-swipe-left,.bi-swipe-right{z-index:1}
.today-agenda .swipe-wrap,.menu-group .swipe-wrap,.mode-group .swipe-wrap{border-radius:0}

/* Splash must be inert after finish even if a class cleanup is delayed. */
.tt-splash[hidden]{display:none!important;pointer-events:none!important}
.tt-splash[aria-hidden="true"]{pointer-events:none}


/* Compact transient status and legacy migration notice: never cover the page title. */
.save-status{top:auto;bottom:calc(var(--tab-h) + var(--safe-bottom) + 12px);left:auto;right:12px;transform:translateY(8px);max-width:calc(100vw - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:96}
.save-status.show{transform:translateY(0)}
.migration-banner{padding:12px;margin-top:8px;margin-bottom:10px}
.migration-banner p{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;margin:4px 0 9px;line-height:1.35}
.migration-banner-actions{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.migration-banner-actions button{min-width:0;min-height:40px;padding:0 5px;font-size:11px;line-height:1.15}

/* One narrow-screen block for the high-risk components. */
@media(max-width:390px){
  :root{--tt-page-x:14px;--tt-calendar-axis:44px;--tt-calendar-day-min:138px;--tt-full-side:64px}
  .content,.live-page,.settings-page{padding-left:14px;padding-right:14px}
  .live-focus,.live-soon{padding:14px}
  .live-event-title{font-size:22px}
  .live-focus-main{grid-template-columns:1fr;justify-items:center;gap:12px}
  .live-progress-button{max-width:124px}
  .live-primary-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .live-primary-metric:last-child{grid-column:1/-1}
  .forecast-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .forecast-grid .forecast-cell:last-child{grid-column:1/-1}
  .forecast-cell strong{font-size:16px}
  .live-count-value{font-size:32px}
  .live-departure-card{grid-template-columns:1fr}
  .live-timing-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tt-alert-stack{margin-left:12px;margin-right:12px}
  .tt-alert{grid-template-columns:4px minmax(0,1fr);padding-right:8px}
  .tt-alert-actions{grid-column:2;justify-content:flex-start;flex-wrap:wrap}
  .settings-row.quiet-row .settings-value{max-width:82px;font-size:12px}
  .focus-mode-pace{font-size:11px}
  .today-row{grid-template-columns:50px minmax(0,1fr) auto;padding-left:9px;padding-right:9px}
  .today-row>.pill{max-width:66px;padding-inline:7px}
  .visual-dashboard{grid-template-columns:1fr}
  .weekly-card{grid-column:auto}
  .menu-row,.settings-row{grid-template-columns:32px minmax(0,1fr) auto 14px;gap:9px}
  .mode-row{grid-template-columns:34px minmax(0,1fr) auto 14px;gap:9px}
  .menu-icon,.settings-icon{width:28px;height:28px}
  .mode-row-icon{width:32px;height:32px}
  .menu-value,.settings-value,.mode-row-value{max-width:82px;font-size:12px}
  .calendar-toolbar-top{gap:6px}
  .calendar-nav-title{font-size:21px}
  .calendar-tool-icons{grid-template-columns:repeat(4,44px);gap:0}
  .calendar-tool-icons .round-btn{width:44px;height:44px;min-width:44px;min-height:44px}
  .calendar-tool-icons .round-btn:before{display:none}
  .nextday-stage-hero.compact{padding:15px}
  .nextday-stage-hero.compact h2{font-size:24px}
  .nextday-kpis,.nextday-review-grid{gap:6px}
  .nextday-kpi,.nextday-review-card{padding:9px 6px}
  .nextday-kpi strong,.nextday-review-card strong{font-size:15px}
  .nextday-stepper-card{padding-left:10px;padding-right:10px}
  .nextday-step-label strong{font-size:11px}
  .full-heading h1{font-size:30px}
  .field{grid-template-columns:92px minmax(0,1fr)}
}

@media(max-width:360px){
  .title{font-size:30px}
  #todayScreen .section-title{grid-template-columns:1fr;align-items:start}
  .today-tools{justify-self:start}
  .live-soon-actions{grid-template-columns:1fr}
  .live-timing-strip{grid-template-columns:1fr}
  .field{display:flex;flex-direction:column;align-items:stretch;gap:5px;padding:10px 12px}
  .field label{font-size:11.5px;color:var(--muted)}
  .field input,.field select,.field textarea{text-align:left}
  .field .switch{align-self:flex-end;margin-top:2px}
  .calendar-nav-title{font-size:20px}
  .calendar-tool-icons{grid-template-columns:repeat(4,44px);gap:0}
  .calendar-tool-icons .round-btn{width:44px;height:44px;min-width:44px;min-height:44px}
  .calendar-tool-icons .round-btn:before{display:none}
  .full-nav{grid-template-columns:64px minmax(0,1fr) 64px;gap:4px}
  .full-nav strong{font-size:16px}
  .full-heading h1{font-size:28px}
  .nextday-step-label strong{font-size:10.5px}
}

/* Center desktop shells without using transform for centering; animations can own transform safely. */
@media(min-width:700px){
  .screen,.full-page,.tabbar{left:50%;right:auto;width:640px;margin-left:-320px}
  .sheet{left:50%;right:auto;width:560px;margin-left:-280px}
  .screen{transform:none}
  .tabbar{transform:none}
  .sheet{transform:translateY(105%)}
  .sheet.show{transform:none}
  .full-page{transform:translateX(103%)}
  .full-page.show{transform:none}
}

@media(prefers-reduced-motion:reduce){
  .screen.active,.live-soon,.now-line,.cal-event.cal-just-changed,.tt-alert,.live-attention,.cal-attention{animation:none!important;transition:none!important}
}

/* Reliability additions: Live refresh, cleanup setting, and TRP. */
.live-mini{position:relative;touch-action:pan-x pan-y}.live-mini-refresh{position:absolute;z-index:4;top:5px;left:50%;transform:translate(-50%,-14px);display:flex;align-items:center;gap:5px;min-height:22px;padding:0 9px;border-radius:999px;background:color-mix(in srgb,var(--surface) 94%,transparent);border:.5px solid var(--line);color:var(--muted);font-size:9px;font-weight:650;opacity:0;pointer-events:none;transition:opacity .16s ease,transform .16s ease;box-shadow:0 2px 8px rgba(0,0,0,.06)}.live-mini.pulling .live-mini-refresh,.live-mini.refresh-ready .live-mini-refresh,.live-mini.is-refreshing .live-mini-refresh{opacity:1;transform:translate(-50%,0)}.live-mini.refresh-ready .live-mini-refresh{color:var(--blue)}.live-mini.is-refreshing .live-mini-refresh .icon{animation:ttMiniSpin .72s linear infinite}.live-mini-refresh-button{width:30px;height:28px;min-width:30px;display:grid;place-items:center;color:var(--muted);border-radius:9px}.live-mini-refresh-button:active{background:var(--surface3)}.live-mini-refresh-button .icon{width:14px;height:14px}@keyframes ttMiniSpin{to{transform:rotate(360deg)}}

(()=>{

const $=(s,r=document)=>{if(typeof r==='string')r=document.querySelector(r);return r?.querySelector(s)||null}, $$=(s,r=document)=>{if(typeof r==='string')r=document.querySelector(r);return r?[...r.querySelectorAll(s)]:[]};

const icons={
  bolt:'<path d="M13 2 5 13h6l-1 9 8-12h-6z"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 10h18"/>',today:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 2v4M16 2v4M7 10h10M8 14h3"/>',book:'<path d="M4 4h7a3 3 0 0 1 3 3v13a3 3 0 0 0-3-3H4zM20 4h-7a3 3 0 0 0-3 3v13a3 3 0 0 1 3-3h7z"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1A1.7 1.7 0 0 0 4.6 15 1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1L7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1z"/>',plus:'<path d="M12 5v14M5 12h14"/>',back:'<path d="m15 18-6-6 6-6"/>',forward:'<path d="m9 18 6-6-6-6"/>',check:'<path d="m5 12 4 4 10-10"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>',play:'<path d="m8 5 11 7-11 7z"/>',trash:'<path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/>',bag:'<path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/>',chart:'<path d="M4 19V9M10 19V5M16 19v-7M22 19V3"/>',warning:'<path d="M12 3 2.5 20h19z"/><path d="M12 9v4M12 17h.01"/>',copy:'<rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',repeat:'<path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/>',route:'<path d="M5 5h5a4 4 0 0 1 4 4v6a4 4 0 0 0 4 4h1"/><circle cx="5" cy="5" r="2"/><circle cx="19" cy="19" r="2"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',ellipsis:'<circle cx="5" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="19" cy="12" r="1" fill="currentColor"/>'};

let toastTimer=null;function toast(msg,ms=2200){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),ms)}

function makeDefaultSchool(){const y=new Date().getFullYear(),fall=new Date().getMonth()>=7;return {periods:{1:{start:540,end:630},2:{start:645,end:735},3:{start:795,end:885},4:{start:900,end:990},5:{start:1005,end:1095},6:{start:1110,end:1200}},terms:[{id:uuid(),label:`${y} ${fall?'秋':'春'}学期`,start:fall?`${y}-09-01`:`${y}-04-01`,end:fall?`${y+1}-01-31`:`${y}-07-31`,courses:[],quizzes:[],createdAt:Date.now()}],archivedTerms:[],activeTermId:null,creditTarget:124,pastEarned:0}}
function defaultState(){const school=makeDefaultSchool();school.activeTermId=school.terms[0].id;return {schemaVersion:2,revision:0,meta:{createdAt:Date.now(),updatedAt:Date.now(),migratedFrom:null,lastTab:'live'},data:{calendars:[{id:'plan',name:'予定',color:'#0a84ff',kind:'plan'},{id:'travel',name:'移動時間',color:'#34c759',kind:'travel'},{id:'rest',name:'休',color:'#ff453a',kind:'rest'},{id:'prep',name:'準備',color:'#bf5af2',kind:'plan'},{id:'work',name:'アルバイト',color:'#ff9f0a',kind:'plan'}],eventTemplates:{},recurrenceSeries:{},occurrenceOverrides:{},executions:{},assignments:[],looseTasks:[],quickTemplates:[],trackingBlocks:[],nextDayPlans:{},nextDayTemplates:[],jobs:[],school},preferences:{appearance:'light',haptics:true,tracking:{startMinute:420,endMinute:1410,byDate:{}},calendar:{zoom:1,view:'two'},live:{timelineZoom:1,warningMinutes:60},notifications:{enabled:false}},diagnostics:{lastSuccessfulSaveAt:null,lastSaveError:null,lastBackupAt:null,lastMigrationAt:null}}}

const inheritedCalendarDefaults=[{id:'plan',name:'予定',color:'#0a84ff',kind:'plan'},{id:'travel',name:'移動時間',color:'#34c759',kind:'travel'},{id:'rest',name:'休',color:'#ff453a',kind:'rest'},{id:'prep',name:'準備',color:'#bf5af2',kind:'plan'},{id:'work',name:'アルバイト',color:'#ff9f0a',kind:'plan'}];
function ensureInheritedCalendars(s){const arr=Array.isArray(s?.data?.calendars)?s.data.calendars:[];for(const d of inheritedCalendarDefaults){let x=arr.find(c=>c.id===d.id)||arr.find(c=>c.name===d.name);if(!x)arr.push(deepClone(d));else if(d.id==='travel'&&x.name==='移動')x.name='移動時間'}s.data.calendars=arr;return s}
function validateStateEnvelope(s){return !!s&&s.schemaVersion===2&&Number.isFinite(s.revision)&&s.data&&typeof s.data.eventTemplates==='object'&&typeof s.data.recurrenceSeries==='object'&&typeof s.data.occurrenceOverrides==='object'&&typeof s.data.executions==='object'&&Array.isArray(s.data.calendars)}

function legacySubSchedule(e){const start=timeMins(e.start||'00:00');const items=Array.isArray(e.items)?e.items:[];return {mode:'sequential',autoReflow:true,items:items.map(it=>{const sm=timeMins(it.start||e.start||'00:00'),em=timeMins(it.end||minsTime(sm+(+it.duration||15)));return {id:it.id||uuid(),title:it.text||it.title||'',plannedDurationMinute:Math.max(1,em-sm),offsetStartMinute:Math.max(0,sm-start),locked:false,notes:it.notes||'',checklist:Array.isArray(it.checklist)?it.checklist.map(ch=>({id:ch.id||uuid(),text:ch.text||'',checkedAt:ch.checkedAt||null})):[]}})}}
function migrateLegacy(raw){let old;try{old=JSON.parse(raw)}catch{return null}const s=defaultState();s.meta.migratedFrom='todaytime_v1';s.diagnostics.lastMigrationAt=Date.now();if(Array.isArray(old.calendars)&&old.calendars.length)s.data.calendars=old.calendars.map(c=>({id:c.id||uuid(),name:c.name||'カレンダー',color:c.color||'#007aff',kind:c.kind||'plan'}));const events=Array.isArray(old.events)?old.events:[];const skippedTravel=new Set(events.filter(e=>e.autoGeneratedTravel&&e.setParentId).map(e=>e.id));events.forEach(e=>{if(e.autoGeneratedTravel||e.autoRest)return;const id=e.id||uuid(),sm=timeMins(e.start||'09:00'),em=timeMins(e.end||minsTime(sm+60));const tpl={id,title:e.title||'予定',location:e.location||'',calendarId:e.calendarId||'plan',categoryLabel:e.categoryLabel||'',priority:clamp(+e.priority||3,1,5),notes:e.notes||'',planned:{date:e.date||dateKey(new Date()),startMinute:sm,durationMinute:Math.max(5,em-sm)},constraints:{mode:'fixed',movable:true,resizable:true,conflictPolicy:'warn'},recurrenceSeriesId:null,subSchedule:legacySubSchedule(e),belongings:Array.isArray(e.belongings)?e.belongings.map(b=>({id:b.id||uuid(),text:b.text||''})):[],travelSet:e.travelSet?.enabled?{enabled:true,before:e.travelSet.before?{durationMinute:+e.travelSet.before,mode:'fixed'}:null,after:e.travelSet.after?{durationMinute:+e.travelSet.after,mode:'fixed'}:null}:null,createdAt:Date.now(),updatedAt:Date.now()};s.data.eventTemplates[id]=tpl;const key=`${id}@${tpl.planned.date}`;if(e.actualStart||e.actualEnd||(e.items||[]).some(x=>x.checkedAt)||(e.belongings||[]).some(x=>x.checkedAt)){s.data.executions[key]={occurrenceKey:key,event:{actualStartAt:e.actualStart||null,actualEndAt:e.actualEnd||null,finishMode:null,scheduledFinishAt:null},subtasks:{},belongings:{}};(e.items||[]).forEach(it=>{if(it.checkedAt)s.data.executions[key].subtasks[it.id]={actualStartAt:null,actualEndAt:it.checkedAt,completedAt:it.checkedAt}});(e.belongings||[]).forEach(b=>{if(b.checkedAt)s.data.executions[key].belonging let state;

function buildNextDayPlanningOverview(k){const ctx=nextDayPlannerContext(k),{x,m,free,recs,carry,clip,p,deadline,unplaced}=ctx;return `<div class="nextday-flow-page nextday-screen-planning">${nextDayIntroCard('plan','計画作成','1日の流れ、空き時間、持ち越しを順番に整えます。','blue')}${nextDayStepperHtml(p)}${p.templatesAppliedAt?`<div class="template-applied-banner"><strong>翌日セット適用済み（${p.appliedTemplateCount||0}件）</strong><br>${p.appliedTemplateIds?.length||0}テンプレートから自動配置しました。${p.templateSkippedCount?`<br><span style="color:var(--orange)">${p.templateSkippedCount}件は競合のため保留</span>`:''}</div>`:!NextDayTemplateService.list().length?`<div class="template-applied-banner"><strong>翌日テンプレート未登録</strong><br>よく使う予定を最大4件まで登録すると、明日の計画に自動投入できます。</div>`:''}${x.hard||x.warn?`<div class="nextday-review-warning ${x.hard?'danger':''}">${icon('warning')}<div><strong>${x.hard?'予定が重なっています':'少し詰まった時間があります'}</strong><span>${x.hard?`${x.hard}件の競合を調整してください。`:`${x.warn}件の注意点があります。`}</span></div><button id="nextdayConflicts">確認</button></div>`:''}<div class="mode-section-title">明日の状態</div><div class="mode-group"><div class="mode-row static"><span class="mode-row-icon blue">${icon('calendar')}</span><span class="mode-row-copy"><span class="mode-row-title">予定</span><span class="mode-row-sub">${esc(x.status.label)}</span></span><span class="mode-row-value">${x.schedule.length}件</span><span></span></div><div class="mode-row static"><span class="mode-row-icon green">${icon('clock')}</span><span class="mode-row-copy"><span class="mode-row-title">空き時間</span><span class="mode-row-sub">使える時間</span></span><span class="mode-row-value">${fmtDuration(x.free)}</span><span></span></div><div class="mode-row static"><span class="mode-row-icon orange">${icon('deadline')}</span><span class="mode-row-copy"><span class="mode-row-title">承認期限</span><span class="mode-row-sub">0時までに確認して確定</span></span><span class="mode-row-value" id="nextdayDeadlineCountdown" data-date="${k}">${deadline||'期限超過'}</span><span></span></div></div>${clip?`<div clas v>`}
function openNextDayPlanning(k=nextDayKey(),{replace=false}={}){getNextDayPlan(k).status='planning';NextDayTemplateService.autoApply(k);safeSave('nextday-planning',{backup:false});openFullPage({nextDayPlan:true,nextDayStage:'planning',navTitle:'翌日',title:'計画作成',subtitle:fmtLong(parseDateKey(k)),html:()=>buildNextDayPlanningOverview(k),bind:r=>{const p=getNextDayPlan(k);bindNextDayOverdueBanner(r);bindNextDayStepperNavigation(r,k,p);$('#nextPlanTimeline',r).onclick=()=>openNextDayTimelinePage(k);$('#nextPlanSlots',r).onclick=()=>openNextDaySlotsPage(k);$('#nextPlanCarry',r).onclick=()=>openNextDayCarryPage(k);$('#nextPlanQuick',r).onclick=()=>openNextDayQuickPage(k);$('#nextPlanTemplates',r).onclick=()=>openContextMenu($('#nextPlanTemplates',r),[{label:'テンプレートを管理',icon:'copy',run:()=>openNextDayTemplatesPage()},{label:'足りない分だけ再適用',icon:'plus',run:()=>{NextDayTemplateService.apply(k,{force:true,replace:false});plannerRefresh()}},{label:'自動投入分を入れ直す',icon:'repeat',run:()=>openActionSheet([{label:'入れ直す',danger:true,run:()=>{NextDayTemplateService.apply(k,{force:true,replace:true});plannerRefresh()}}],'自動投入された予定だけ入れ直します')}],'翌日テンプレート');$('#nextdayMultiPaste',r)?.addEventListener('click',()=>openTomorrowMultiSlotPaste(k));$('#nextdayToReview',r).onclick=()=>{setNextDayPlanStatus(k,'review',{refresh:false});openNextDayReview(k)};updateNextDayDeadlineUI()}},{replace})}
function bindNextDayStepperNavigation(root,k,p=getNextDayPlan(k)){$$('[data-nextday-step]',root).forEach(b=>{const s=b.dataset.nextdayStep;if(s==='planning'&&p.status!=='planning'&&!b.disabled)b.onclick=()=>{setNextDayPlanStatus(k,'planning',{refresh:false});openNextDayPlanning(k,{replace:true})};if(s==='review'&&p.status==='approved'&&!b.disabled)b.onclick=()=>{setNextDayPlanStatus(k,'review',{refresh:false});openNextDayReview(k,{replace:true})}})}

/* Brand intro controller: initialization continues behind the opaque splash; reveal only after render is ready. */
const SplashController=(()=>{
  const FLAG='tt_splash_seen';
  const MIN_MS=1650;
  const REDUCED_MIN_MS=700;
  const EXIT_MS=390;
  let exitTimer=0;
  const boot=()=>window.__TT_SPLASH_BOOT||{show:false,force:false,start:performance.now(),flag:FLAG};
  const el=()=>document.getElementById('splash');
  const reduced=()=>window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
  function enter({force=false}={}){
    const s=el();if(!s)return;
    clearTimeout(window.__TT_SPLASH_FAILSAFE);clearTimeout(exitTimer);
    document.documentElement.classList.add('tt-splash-pending');
    document.documentElement.classList.remove('tt-splash-revealing');
    s.hidden=false;s.setAttribute('aria-hidden','false');s.classList.remove('is-entered','is-exiting');
    window.__TT_SPLASH_BOOT={show:true,force,start:performance.now(),flag:FLAG};
    requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('is-entered')));
  }
  function finish({markSeen=true}={}){
    const s=el();if(!s)return;
    if(!document.documentElement.classList.contains('tt-splash-pending'))return;
    clearTimeout(window.__TT_SPLASH_FAILSAFE);
    document.documentElement.classList.add('tt-splash-revealing');
    s.classList.add('is-exiting');s.setAttribute('aria-hidden','true');
    if(markSeen){try{localStorage.setItem(FLAG,'1')}catch{}}
    exitTimer=setTimeout(()=>{
      document.documentElement.classList.remove('tt-splash-pending','tt-splash-revealing');
      s.hidden=true;s.classList.remove('is-entered','is-exiting');
    },reduced()?40:EXIT_MS);
  }
  function ready(){
    const b=boot();if(!b.show)return;
    const min=reduced()?REDUCED_MIN_MS:MIN_MS;
    const wait=Math.max(0,min-(performance.now()-b.start));
    setTimeout(()=>finish({markSeen:true}),wait);
  }
  function replay(){enter({force:true});setTimeout(()=>finish({markSeen:false}),reduced()?REDUCED_MIN_MS:MIN_MS)}
  return {enter,finish,ready,replay,flag:FLAG};
})();
window.TodayTimeSplash=SplashController;

function acaCalendarInfo(o,now=Date.now()){
  if(!acaEnabled()||!o||o.source!=='event'||isPassiveOccurrence(o))return null;
  const ex=executionFor(o.occurrenceKey,false),actualStart=ex?.event?.actualStartAt||null,actualEnd=ex?.event?.actualEndAt||null;

     the block closes at the actual end time. */
  const visualEndMinute=actualEndMinute??Math.max(o.endMinute,sm+1);
  return {

    startKind:actualStart?'actual':'predicted',
    endKind:actualEnd?'actual':'predicted',
    startAt:estimatedStart,
    predictedEndAt:predictedEnd,

function ttSubBaseline(o){

  if(!raw.length)return [];

/* ACA for a subtask follows the same gate as a parent event: only the current unfinished subtask
   is shown, and the following subtask receives no ACA until this one is completed. */

function ttIsStandalone(){return !!(window.matchMedia?.('(display-mode: standalone)')?.matches||navigator.standalone===true)}

function ttPushSnapshot(){
  const os=ttOneSignal();
  const nativeSupported='Notification' in window;
  const nativePermission=nativeSupported&&Notification.permission==='granted';
  if(!os)return {ready:false,supported:nativeSupported,permission:nativePermission,optedIn:false,id:null,standalone:ttIsStandalone()};
  let supported=false,permission=nativePermission,optedIn=false,id=null;
  try{supported=!!os.Notifications.isPushSupported()}catch{}
  try{permission=!!os.Notifications.permission||nativePermission}catch{}
  try{optedIn=!!os.User.PushSubscription.optedIn}catch{}
  try{id=os.User.PushSubscription.id||null}catch{}
  return {ready:true,supported,permission,optedIn,id,standalone:ttIsStandalone()};
}
async function ttRequestIOSPermission(){
  if(!ttIsStandalone())return toast('iPhoneではホーム画面のTodayTimeから開いてください',4200);
  if(!('Notification' in window))return toast('この環境では通知を利用できません',3500);
  try{
    let granted=Notification.permission==='granted';
    if(!granted){
      const os=ttOneSignal();
      if(os&&os.Notifications&&typeof os.Notifications.requestPermission==='function'){
        await os.Notifications.requestPermission();
      }else{
        await Notification.requestPermission();
      }
      granted=Notification.permission==='granted';
      try{if(!granted&&os)granted=!!os.Notifications.permission}catch{}
    }
    if(!granted){
      return toast('iOSの通知が許可されませんでした。iPhoneの設定も確認してください',4500);
    }
    state.preferences.notifications.enabled=true;
    safeSave('ios-notification-permission',{backup:false});
    toast('iOSの通知を許可しました',2600);
    setTimeout(()=>{closeFullPage();openNotificationSettings()},350);
  }catch(err){
    console.error('iOS notification permission',err);
    toast('通知許可を表示できませんでした',4000);
  }
}

async function ttSubscribePush(){

  const snap=ttPushSnapshot();

const TT_AUTOPUSH_CONFIG_KEY='todaytime:webpush:server:v1';

function ttReadJSON(key,fallback){try{return JSON.parse(localStorage.getItem(key)||'null')??fallback}catch{return fallback}}
function ttWriteJSON(key,value){localStorage.setItem(key,JSON.stringify(value))}
function ttAutoPushConfig(){const x=ttReadJSON(TT_AUTOPUSH_CONFIG_KEY,{});return {url:String(x.url||'').trim().replace(/\/+$/,''),key:String(x.key||'')}}
function ttAutoPushMap(){const x=ttReadJSON(TT_AUTOPUSH_MAP_KEY,{});return x&&typeof x==='object'?x:{}}
function ttAutoPushStatus(){return ttReadJSON(TT_AUTOPUSH_STATUS_KEY,{lastSyncAt:null,lastError:null,scheduled:0})}
function ttAutoPushReady(){const c=ttAutoPushConfig(),p=ttPushSnapshot();return !!(c.url&&c.key&&p.ready&&p.optedIn&&p.permission)}
function ttAutoPushDateLabel(ts){return ts?new Date(ts).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'未同期'}

async function ttWorkerCall(path,payload){
  const c=ttAutoPushConfig();if(!c.url||!c.key)throw new Error('通知サーバーが未設定です');
  const res=await fetch(c.url+path,{method:'POST',headers:{'Content-Type':'application/json','X-TodayTime-Key':c.key},body:JSON.stringify(payload||{})});
  let data={};try{data=await res.json()}catch{}

      add('pre',pre,o.title,`予定開始まであと${lead}分`);
      add('start',start,o.title,'ただいま開始時刻');
      const eventExecution=executionFor(o.occurrenceKey,false);
      if(!eventExecution?.event?.actualStartAt)add('actual-missing',start+5*MIN,o.title,'実績が未開始です\n実績修正を行ってください');
      try{resolveSubtasks({...o,execution:eventExecution}).forEach(it=>add('sub',localDateTime(o.date,it.startMinute).getTime(),`${o.title}(SB)`,`次:${it.title}`,it.id))}catch{}
    }
  }
  const unique=new Map();out.forEach(x=>unique.set(x.fingerprint,x));return [...unique.values()].sort((a,b)=>a.sendAt-b.sendAt)
}
async function ttAutoPushCancelEntry(entry){if(!entry?.messageId)return true;await ttWorkerCall('/cancel',{messageId:entry.messageId});return true}
async function ttAutoPushScheduleItem(item){
  const idempotencyKey=crypto.randomUUID();
  const data=await ttWorkerCall('/schedule',{title:item.title,body:item.body,sendAfter:new Date(item.sendAt).toISOString(),kind:item.kind,idempotencyKey});
  return {...item,messageId:data.messageId,idempotencyKey,createdAt:Date.now()}
}
async function ttSyncAutoPush({manual=false}={}){
  if(ttAutoPushRunning){if(manual)toast('通知を同期中です');return false}
  if(!ttAutoPushReady()){if(manual)toast('先にWeb Pushと通知サーバーを設定してください',3800);return false}
  ttAutoPushRunning=true;
  const desired=ttAutoPushDesired(),wanted=new Map(desired.map(x=>[x.fingerprint,x])),stored=ttAutoPushMap(),next={...stored};let canceled=0,created=0,error=null;
  try{
    for(const [fp,entry] of Object.entries(stored)){
      if((entry.sendAt||0)<=Date.now()+5000){delete next[fp];continue}
      if(wanted.has(fp))continue;
      try{await ttAutoPushCancelEntry(entry);delete next[fp];canceled++}catch(err){console.warn('push cancel',err);error=err}
    }
    ttWriteJSON(TT_AUTOPUSH_MAP_KEY,next);
    for(const item of desired){
      if(next[item.fingerprint]?.messageId)continue;
      try{const made=await ttAutoPushScheduleItem(item);next[item.fingerprint]=made;ttWriteJSON(TT_AUTOPUSH_MAP_KEY,next);created++}catch(err){console.warn('push schedule',err);error=err;break}
    }
    const active=Object.values(next).filter(x=>(x.sendAt||0)>Date.now()).length,status={lastSyncAt:Date.now(),lastError:error?String(error.message||error):null,scheduled:active,created,canceled};ttWriteJSON(TT_AUTOPUSH_STATUS_KEY,status);
    if(manual)toast(error?`一部同期できませんでした（予約 ${active}件）`:`通知を同期しました（予約 ${active}件）`,4200);
    return !error
  }finally{ttAutoPushRunning=false}
}
function ttQueueAutoPushSync(delay=1000){clearTimeout(ttAutoPushTimer);ttAutoPushTimer=setTimeout(()=>ttSyncAutoPush().catch(console.warn),delay)}

function openAutoPushServerSettings(){
  const c=ttAutoPushConfig(),s=ttAutoPushStatus();openFullPage({title:'自動通知サーバー',html:`
    <div class="hero"><div class="hero-kicker">Cloudflare Worker</div><div class="hero-value">${c.url&&c.key?'設定済み':'未設定'}</div><div class="hero-sub">OneSignalの秘密のAPIキーをTodayTime本体に置かず、安全なサーバー経由で通知を予約します</div></div>
    <div class="form-group">
      <div class="field title-field"><label>Worker URL</label><input id="ttWorkerUrl" value="${esc(c.url)}" placeholder="https://todaytime-push.xxxxx.workers.dev" autocomplete="off"></div>
      <div class="field title-field"><label>Sync Key</label><input id="ttWorkerKey" type="password" value="${esc(c.key)}" placeholder="Cloudflareに設定した共通キー" autocomplete="off"></div>
    </div>
    <div class="user-note" style="padding:12px 4px">OneSignalのApp API Keyはここには入力しません。Cloudflare WorkerのSecretだけに保存します。</div>
    <button class="primary-wide" id="ttSaveServer">保存</button>
    <button class="primary-wide" id="ttTestServer" style="background:var(--surface);color:var(--blue)">接続テスト通知を送る</button>
    <div class="score-insight ${s.lastError?'next':'good'}"><strong>最終同期：${ttAutoPushDateLabel(s.lastSyncAt)}</strong><span>${s.lastError?esc(s.lastError):`現在 ${s.scheduled||0}件を予約中`}</span></div>
  `,bind:r=>{
    $('#ttSaveServer',r).onclick=()=>{const url=$('#ttWorkerUrl',r).value.trim().replace(/\/+$/,''),key=$('#ttWorkerKey',r).value;if(!/^https:\/\//.test(url)||!key)return toast('Worker URLとSync Keyを入力してください');ttWriteJSON(TT_AUTOPUSH_CONFIG_KEY,{url,key});toast('通知サーバー設定を保存しました');ttQueueAutoPushSync(300)};
    $('#ttTestServer',r).onclick=async()=>{const url=$('#ttWorkerUrl',r).value.trim().replace(/\/+$/,''),key=$('#ttWorkerKey',r).value;if(!/^https:\/\//.test(url)||!key)return toast('先にURLとSync Keyを入力してください');ttWriteJSON(TT_AUTOPUSH_CONFIG_KEY,{url,key});try{await ttWorkerCall('/test',{});toast('接続テスト通知を送信しました')}catch(err){toast(`接続失敗：${err.message}`,5000)}};
  }})
}

const ttOpenNotificationSettingsBase=openNotificationSettings;
openNotificationSettings=function(){
  const x=ttPushSnapshot(),c=ttAutoPushConfig(),s=ttAutoPushStatus(),status=!x.ready?'準備中':x.optedIn&&x.permission?'登録済み':x.permission?'許可済み':'未登録';
  openFullPage({title:'通知',html:`
    <div class="hero"><div class="hero-kicker">OneSignal Web Push</div><div class="hero-value">${status}</div><div class="hero-sub">TodayTimeを閉じていても予定時刻に通知します</div></div>
    <div class="full-group">
      <div class="full-row"><div><div class="full-row-title">ホーム画面アプリ</div></div><div class="full-row-value">${x.standalone?'はい':'いいえ'}</div></div>
      <div class="full-row"><div><div class="full-row-title">iOS通知許可</div></div><div class="full-row-value">${x.permission?'許可済み':'未許可'}</div></div>
      <div class="full-row"><div><div class="full-row-title">OneSignal購読</div></div><div class="full-row-value">${x.optedIn?'登録済み':'未登録'}</div></div>
      <div class="full-row"><div><div class="full-row-title">自動通知サーバー</div></div><div class="full-row-value">${c.url&&c.key?'設定済み':'未設定'}</div></div>
      <div class="full-row"><div><div class="full-row-title">予約済み通知</div><span class="full-row-sub">最大30日先まで自動予約</span></div><div class="full-row-value">${s.scheduled||0}件</div></div>
      <div class="full-row"><div><div class="full-row-title">最終同期</div></div><div class="full-row-value">${ttAutoPushDateLabel(s.lastSyncAt)}</div></div>
    </div>
    ${s.lastError?`<div class="validation-box warn">前回の同期：${esc(s.lastError)}</div>`:''}
    ${!x.permission?'<button class="primary-wide" id="ttIOSPermission">iOSの通知を許可する</button>':''}
    <button class="primary-wide" id="ttWebPushToggle" ${!x.permission&&!x.optedIn?'style="background:var(--surface);color:var(--blue)"':''}>${x.optedIn?'Web Pushをオフにする':'Web Pushを登録する'}</button>
    <button class="primary-wide" id="ttServerSettings" style="background:var(--surface);color:var(--blue)">自動通知サーバー設定</button>
    <button class="primary-wide" id="ttSyncPush" style="background:var(--surface);color:var(--blue)">今すぐ予定通知を同期</button>
    <button class="primary-wide" id="ttRefreshPush" style="background:var(--surface);color:var(--blue)">状態を再確認</button>
  `,bind:r=>{
    const permBtn=$('#ttIOSPermission',r);if(permBtn)permBtn.onclick=ttRequestIOSPermission;
    $('#ttWebPushToggle',r).onclick=()=>x.optedIn?ttUnsubscribePush():ttSubscribePush();
    $('#ttServerSettings',r).onclick=openAutoPushServerSettings;
    $('#ttSyncPush',r).onclick=()=>ttSyncAutoPush({manual:true}).then(()=>{setTimeout(()=>{closeFullPage();openNotificationSettings()},500)});
    $('#ttRefreshPush',r).onclick=()=>{closeFullPage();setTimeout(openNotificationSettings,60)};
  }})
};

/* Avoid duplicate foreground local notifications once server-side Web Push is active. */
const ttLocalNotificationTick=NotificationScheduler.tick.bind(NotificationScheduler);
NotificationScheduler.tick=function(){if(ttAutoPushReady())return;return ttLocalNotificationTick()};

Bus.on('mutation',({mutation}={})=>{if(!mutation)return;const types=new Set(['createTemplate','updateOccurrence','moveOccurrence','resizeOccurrence','deleteOccurrence','applyNextDayTemplates','startOccurrence','finishOccurrence','editExecution']);if(types.has(mutation.type))ttQueueAutoPushSync(900)});
Bus.on('saved',({reason}={})=>{if(['soon-minutes','web-push-subscribe','restore','restore-merge'].includes(reason))ttQueueAutoPushSync(800)});
setTimeout(()=>ttQueueAutoPushSync(400),3500);


setTab(runtime.tab,{history:false});
SplashController.ready();
})();
</script>
