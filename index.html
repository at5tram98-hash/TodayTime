<!doctype html>
<html lang="ja" class="booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f2f2f7">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TodayTime">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="description" content="今日・明日・1週間の予定とTodo、実行時間の記録、大学の課題をまとめて管理">
<title>TodayTime Pro</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="stylesheet" href="src/styles/app.css">
<link rel="modulepreload" href="src/main.js">
<script>
  // Theme before first paint (no white flash in dark mode).
  (function () {
    var a = 'system';
    try { a = localStorage.getItem('tt:appearance') || 'system'; } catch (e) {}
    var dark = a === 'dark' || (a === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    try { var s = +localStorage.getItem('tt:scale'); if (s) document.documentElement.style.setProperty('--scale', s); } catch (e) {}
  })();
</script>
</head>
<body>
<div id="splash" aria-hidden="true">
  <svg viewBox="0 0 88 88" width="72" height="72"><path d="M67.5 28.5A30 30 0 1 1 58.5 17" fill="none" stroke="#0a84ff" stroke-width="6.5" stroke-linecap="round"/><path d="M44 27v18l13 8" fill="none" stroke="#0a84ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="54" y="8" width="25" height="23" rx="7" fill="#0a84ff"/></svg>
</div>
<div id="root"></div>
<noscript>TodayTime Pro を使うにはJavaScriptを有効にしてください。</noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
